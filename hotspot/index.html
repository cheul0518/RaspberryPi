<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- 홈 화면에서 Safari 탭이 아닌 독립 앱 창으로 실행 → 실행할 때마다 탭이 생기지 않음 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="핫스팟">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>핫스팟</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#8e8e93; --on:#34c759; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
         padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); user-select:none; -webkit-user-select:none; }
  #label { font-size:56px; font-weight:800; color:var(--muted); transition:color .2s; }
  #label.on { color:var(--on); }
  #btn { width:200px; height:200px; border-radius:50%; border:none; background:var(--card); color:var(--text);
         box-shadow:0 10px 24px rgba(0,0,0,.25); transition:transform .15s, box-shadow .15s, background .2s; cursor:pointer; }
  #btn svg { width:80px; height:80px; }
  /* 눌린 상태: 작아지고 그림자가 안쪽으로 → 눌려 들어간 느낌 */
  #btn.on { background:var(--on); color:#fff; transform:scale(.92); box-shadow:inset 0 6px 14px rgba(0,0,0,.35); }
  #name { font-size:17px; font-weight:600; color:var(--muted); }
</style>
</head>
<body>
  <div id="label">OFF</div>
  <button id="btn" aria-label="핫스팟 켜기/끄기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
    </svg>
  </button>
  <div id="name">개인용 핫스팟</div>
<script>
// iOS는 웹페이지가 핫스팟을 직접 켜는 걸 막아 두어서, 단축어 2개를 실행해 켜고 끕니다.
// 아이폰 단축어 이름이 아래와 정확히 같아야 합니다.
const SHORTCUT_ON = '핫스팟 켜기';
const SHORTCUT_OFF = '핫스팟 끄기';

const btn = document.getElementById('btn'), label = document.getElementById('label');
const KEY = 'hotspotOn';
const here = location.origin + location.pathname;

function load() { try { return localStorage.getItem(KEY) === '1'; } catch { return false; } }
function save(v) { try { localStorage.setItem(KEY, v ? '1' : '0'); } catch {} }
function render(on) {
  btn.classList.toggle('on', on);
  label.classList.toggle('on', on);
  label.textContent = on ? 'ON' : 'OFF';
}

// 단축어 실행이 끝나면 ?s=on / ?s=off 를 붙여 이 페이지로 돌아옵니다
const s = new URLSearchParams(location.search).get('s');
let on = s ? s === 'on' : load();
save(on); render(on);
if (s) history.replaceState(null, '', here);

btn.addEventListener('click', () => {
  const next = !on;
  on = next; save(on); render(on);   // 버튼은 바로 눌린/원위치 상태로 바뀜
  // 단축어 실행 후 자동 복귀: iOS 26의 webapp:// 주소로 홈 화면 웹앱(이 창)을 다시 엽니다.
  // https:// 로 돌아오면 Safari 새 탭이 생기므로 쓰지 않습니다.
  // webapp:// 은 주소 뒤 경로·파라미터를 무시하므로, 상태는 위에서 미리 저장해 둡니다.
  // 공백이 '+'가 아닌 %20 으로 들어가야 단축어 이름이 정확히 맞습니다
  const back = encodeURIComponent('webapp://' + location.host + location.pathname);
  const url = 'shortcuts://x-callback-url/run-shortcut?name=' + encodeURIComponent(next ? SHORTCUT_ON : SHORTCUT_OFF)
    + '&x-success=' + back + '&x-cancel=' + back + '&x-error=' + back;
  setTimeout(() => { location.href = url; }, 180);
});
</script>
</body>
</html>
