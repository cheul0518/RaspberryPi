<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- 홈 화면에서 Safari 탭이 아닌 독립 앱 창으로 실행 → 실행할 때마다 탭이 생기지 않음 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="핫스팟">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>핫스팟</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#8e8e93; --line:#d1d1d6; --on:#34c759;
          --v3:#ff9500; --v5:#ff3b30; --gnd:#3a3a3c; --gpio:#007aff; --off-pin:#e5e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --line:#38383a; --gnd:#8e8e93; --off-pin:#2c2c2e; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif;
         user-select:none; -webkit-user-select:none; }

  /* 탭 화면: 한 번에 하나만 보임 */
  .page { display:none; position:fixed; inset:0; bottom:calc(64px + env(safe-area-inset-bottom));
          padding:env(safe-area-inset-top) 16px 16px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .page.active { display:flex; flex-direction:column; align-items:center; }

  /* 아래 탭 바 */
  #tabbar { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card);
            border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  #tabbar button { flex:1; height:64px; border:none; background:none; color:var(--muted);
                   font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center;
                   justify-content:center; gap:3px; cursor:pointer; }
  #tabbar button svg { width:26px; height:26px; }
  #tabbar button.active { color:var(--gpio); }

  /* 1번 탭: 핫스팟 */
  #p1 { justify-content:center; gap:28px; }
  #label { font-size:56px; font-weight:800; color:var(--muted); transition:color .2s; }
  #label.on { color:var(--on); }
  #btn { width:200px; height:200px; border-radius:50%; border:none; background:var(--card); color:var(--text);
         box-shadow:0 10px 24px rgba(0,0,0,.25); transition:transform .15s, box-shadow .15s, background .2s; cursor:pointer; }
  #btn svg { width:80px; height:80px; }
  /* 눌린 상태: 작아지고 그림자가 안쪽으로 → 눌려 들어간 느낌 */
  #btn.on { background:var(--on); color:#fff; transform:scale(.92); box-shadow:inset 0 6px 14px rgba(0,0,0,.35); }
  .name { font-size:17px; font-weight:600; color:var(--muted); }

  /* 2번 탭: GPIO 핀아웃 */
  #p2 h2 { margin:12px 0 2px; font-size:22px; }
  #p2 .hint { margin:0 0 12px; font-size:13px; color:var(--muted); text-align:center; }
  #header { display:grid; grid-template-columns:1fr 28px 28px 1fr; gap:6px 6px; width:100%; max-width:380px;
            background:var(--card); border-radius:14px; padding:10px; }
  .lab { font-size:12px; font-weight:600; display:flex; align-items:center; min-height:32px; padding:0 8px;
         border-radius:8px; background:var(--off-pin); color:var(--muted); }
  .lab.left { justify-content:flex-end; text-align:right; }
  .lab.gpio { color:var(--text); cursor:pointer; border:1.5px solid var(--gpio); background:transparent; }
  .lab.gpio.on { background:var(--on); border-color:var(--on); color:#fff; }
  .lab.gpio.on::after { content:' ON'; font-weight:800; margin-left:4px; }
  .lab.left.gpio.on::after { content:''; }
  .lab.left.gpio.on::before { content:'ON '; font-weight:800; margin-right:4px; }
  .lab .sub { font-weight:500; opacity:.75; margin:0 3px; white-space:nowrap; }
  .num { width:28px; height:32px; display:flex; align-items:center; justify-content:center; font-size:11px;
         font-weight:700; border-radius:50%; color:#fff; align-self:center; height:28px; }
  .num.v3 { background:var(--v3); } .num.v5 { background:var(--v5); } .num.gnd { background:var(--gnd); }
  .num.gpio { background:var(--gpio); } .num.id { background:var(--muted); }
  #host { margin-top:14px; width:100%; max-width:380px; font-size:13px; color:var(--muted); }
  #host input { width:100%; margin-top:4px; padding:10px; font-size:15px; border-radius:10px;
                border:1px solid var(--line); background:var(--card); color:var(--text); }
  #alloff { margin-top:12px; padding:10px 18px; border-radius:10px; border:none; background:var(--card);
            color:var(--v5); font-weight:600; font-size:15px; }

  /* 3번 탭: 비어 있음 */
  #p3 { justify-content:center; color:var(--muted); }
</style>
</head>
<body>

<!-- 1번 탭: 핫스팟 -->
<section class="page" id="p1">
  <div id="label">OFF</div>
  <button id="btn" aria-label="핫스팟 켜기/끄기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
    </svg>
  </button>
  <div class="name">개인용 핫스팟</div>
</section>

<!-- 2번 탭: 라즈베리 파이 5 핀아웃 + GPIO ON/OFF -->
<section class="page" id="p2">
  <h2>Raspberry Pi 5 핀아웃</h2>
  <p class="hint">파란 테두리 GPIO를 누르면 ON/OFF · 1번 핀 = USB·LAN 포트 반대쪽 끝</p>
  <div id="header"></div>
  <button id="alloff">켜진 GPIO 모두 끄기</button>
  <label id="host">파이 주소 (보통 그대로 두면 됨)
    <input id="hostInput" autocapitalize="off" autocorrect="off" spellcheck="false">
  </label>
</section>

<!-- 3번 탭: 비워 둠 -->
<section class="page" id="p3">
  <div class="name">준비 중</div>
</section>

<nav id="tabbar">
  <button data-tab="1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
    핫스팟
  </button>
  <button data-tab="2">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="10" cy="6" r="1"/><circle cx="14" cy="6" r="1"/><circle cx="10" cy="10" r="1"/><circle cx="14" cy="10" r="1"/><circle cx="10" cy="14" r="1"/><circle cx="14" cy="14" r="1"/><circle cx="10" cy="18" r="1"/><circle cx="14" cy="18" r="1"/></svg>
    GPIO
  </button>
  <button data-tab="3">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    3번
  </button>
</nav>

<script>
// ───────── 공통 ─────────
// iOS는 웹페이지가 핫스팟을 켜거나 파이(http://)에 직접 요청하는 걸 막아 두어서,
// 아이폰 단축어를 실행해서 처리합니다. 단축어 이름이 아래와 정확히 같아야 합니다.
const SHORTCUT_ON = '핫스팟 켜기';
const SHORTCUT_OFF = '핫스팟 끄기';
const SHORTCUT_GPIO = 'GPIO 제어';

function load(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

// 단축어 실행 → 끝나면 iOS 26의 webapp:// 주소로 이 홈 화면 웹앱으로 자동 복귀
// (webapp:// 은 주소 뒤 경로·파라미터를 무시하므로, 탭·버튼 상태는 미리 저장해 둠)
// 공백이 '+'가 아닌 %20 으로 들어가야 단축어 이름이 정확히 맞음
function runShortcut(name, text) {
  const back = encodeURIComponent('webapp://' + location.host + location.pathname);
  let url = 'shortcuts://x-callback-url/run-shortcut?name=' + encodeURIComponent(name);
  if (text) url += '&input=text&text=' + encodeURIComponent(text);
  url += '&x-success=' + back + '&x-cancel=' + back + '&x-error=' + back;
  setTimeout(() => { location.href = url; }, 180);
}

// ───────── 탭 ─────────
function showTab(n) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'p' + n));
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === String(n)));
  save('tab', n);   // 단축어 다녀와도 같은 탭으로 돌아오도록 저장
}
document.querySelectorAll('#tabbar button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
showTab(load('tab', 1));

// ───────── 1번 탭: 핫스팟 ─────────
const btn = document.getElementById('btn'), label = document.getElementById('label');
let hotspotOn = load('hotspotOn', false) === true || load('hotspotOn', 0) === 1;
function renderHotspot() {
  btn.classList.toggle('on', hotspotOn);
  label.classList.toggle('on', hotspotOn);
  label.textContent = hotspotOn ? 'ON' : 'OFF';
}
renderHotspot();
btn.addEventListener('click', () => {
  hotspotOn = !hotspotOn; save('hotspotOn', hotspotOn); renderHotspot();   // 버튼은 바로 눌린/원위치 상태로
  runShortcut(hotspotOn ? SHORTCUT_ON : SHORTCUT_OFF);
});

// ───────── 2번 탭: GPIO ─────────
// 라즈베리 파이 5의 40핀 헤더. [핀 번호, 종류, 이름, GPIO 번호]
// 종류: v3 = 3.3V 전원, v5 = 5V 전원, gnd = 접지, gpio = 제어 가능한 핀, id = HAT 정보용(제어 안 함)
const PINS = [   // 보조 기능은 대표 1개만 표시 (핀 하나에 기능이 여러 개라 문서마다 다르게 적기도 함. 예: GPIO18 = SPI1 CE0 / PCM CLK / PWM)
  [1,'v3','3V3'],                  [2,'v5','5V'],
  [3,'gpio','GPIO2','SDA',2],         [4,'v5','5V'],
  [5,'gpio','GPIO3','SCL',3],         [6,'gnd','GND'],
  [7,'gpio','GPIO4','GPCLK0',4],      [8,'gpio','GPIO14','TXD',14],
  [9,'gnd','GND'],                 [10,'gpio','GPIO15','RXD',15],
  [11,'gpio','GPIO17','SPI1 CE1',17], [12,'gpio','GPIO18','SPI1 CE0',18],
  [13,'gpio','GPIO27','',27],         [14,'gnd','GND'],
  [15,'gpio','GPIO22','',22],         [16,'gpio','GPIO23','',23],
  [17,'v3','3V3'],                 [18,'gpio','GPIO24','',24],
  [19,'gpio','GPIO10','SPI0 MOSI',10],[20,'gnd','GND'],
  [21,'gpio','GPIO9','SPI0 MISO',9],  [22,'gpio','GPIO25','',25],
  [23,'gpio','GPIO11','SPI0 SCLK',11],[24,'gpio','GPIO8','SPI0 CE0',8],
  [25,'gnd','GND'],                [26,'gpio','GPIO7','SPI0 CE1',7],
  [27,'id','ID_SD'],               [28,'id','ID_SC'],
  [29,'gpio','GPIO5','',5],           [30,'gnd','GND'],
  [31,'gpio','GPIO6','',6],           [32,'gpio','GPIO12','PWM',12],
  [33,'gpio','GPIO13','PWM',13],      [34,'gnd','GND'],
  [35,'gpio','GPIO19','SPI1 MISO',19],[36,'gpio','GPIO16','SPI1 CE2',16],
  [37,'gpio','GPIO26','',26],         [38,'gpio','GPIO20','SPI1 MOSI',20],
  [39,'gnd','GND'],                [40,'gpio','GPIO21','SPI1 SCLK',21],
];

const hostInput = document.getElementById('hostInput');
hostInput.value = load('piHost', 'raspberrypi.local:8000');
hostInput.addEventListener('change', () => save('piHost', hostInput.value.trim() || 'raspberrypi.local:8000'));

let gpioOn = load('gpioOn', {});   // { "17": true, ... }  마지막으로 누른 상태 기억
const header = document.getElementById('header');

function labelEl([pin, kind, name, sub, gpio], side) {
  const el = document.createElement('div');
  el.className = 'lab ' + side + (kind === 'gpio' ? ' gpio' : '');
  el.innerHTML = side === 'left'
    ? (sub ? `<span class="sub">${sub}</span>` : '') + name
    : name + (sub ? `<span class="sub">${sub}</span>` : '');
  if (kind === 'gpio') {
    el.dataset.gpio = gpio;
    el.addEventListener('click', () => toggleGpio(gpio));
  }
  return el;
}
function numEl([pin, kind]) {
  const el = document.createElement('div');
  el.className = 'num ' + kind;
  el.textContent = pin;
  return el;
}
for (let i = 0; i < PINS.length; i += 2) {   // 한 줄 = 왼쪽(홀수 핀) + 오른쪽(짝수 핀)
  header.append(labelEl(PINS[i], 'left'), numEl(PINS[i]), numEl(PINS[i + 1]), labelEl(PINS[i + 1], 'right'));
}

function renderGpio() {
  header.querySelectorAll('.lab.gpio').forEach(el => el.classList.toggle('on', !!gpioOn[el.dataset.gpio]));
}
renderGpio();

function toggleGpio(gpio) {
  const next = !gpioOn[gpio];
  gpioOn[gpio] = next; save('gpioOn', gpioOn); renderGpio();
  // 단축어 "GPIO 제어"가 http:// + 이 텍스트 주소를 열어 파이 서버에 명령을 보냄
  runShortcut(SHORTCUT_GPIO, `${load('piHost', 'raspberrypi.local:8000')}/gpio/${gpio}/${next ? 'on' : 'off'}`);
}

document.getElementById('alloff').addEventListener('click', () => {
  gpioOn = {}; save('gpioOn', gpioOn); renderGpio();
  runShortcut(SHORTCUT_GPIO, `${load('piHost', 'raspberrypi.local:8000')}/gpio/all/off`);
});
</script>
</body>
</html>
